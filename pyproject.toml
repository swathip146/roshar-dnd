[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roshar-dnd"
version = "0.5.0"
description = "AI Dungeon Master for D&D 5e in Brandon Sanderson's Cosmere (Roshar)"
requires-python = ">=3.10"

# Runtime dependencies live in requirements.txt, which install_dependencies.sh
# and run_game.sh already use. This file exists for tooling config (plan 4:
# pytest marks were unregistered, so `-m unit` silently matched nothing).

[tool.pytest.ini_options]
# Plan 4: `pytest tests/` used to abort with INTERNALERROR because three files
# ran pytest.main()/sys.exit() at import scope (fixed in 0.8), and the marks
# below were never registered, so filtering by them silently selected nothing.
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",   # an unregistered mark is now an error, not a silent no-op
    "-ra",
    # PARALLEL BY DEFAULT. Sequentially the suite takes ~4.5 minutes (combat alone
    # 170s), which is slow enough that it stops being run on every change — and an
    # unrun test is no test. Measured on 12 cores:
    #
    #     combat       170s -> 15s   (497 passed)
    #     non-combat   100s -> 46s   (1034 passed)
    #
    # `-n auto` would use all 12; 8 leaves headroom so the machine stays usable and
    # the workers do not contend.
    #
    # It also removed a REAL failure: test_encounter_does_not_end_at_zero_hp passed
    # alone and failed in the full sequential run. Fresh worker processes isolate the
    # class-level global state this codebase carries (`Entity._entity_by_position`,
    # `Tile._tile_registry`, the condition registries) — so the parallel result is
    # the more trustworthy one, not merely the faster one.
    #
    # CAVEAT: xdist hides ordering bugs as well as working around them. When a test
    # fails, re-run that FILE with `-p no:xdist -n0` before concluding anything about
    # why. Use `-n0` for pdb, and for any test that needs a single shared process.
    "-n", "8",
]
markers = [
    "unit: fast, no I/O, no network",
    "integration: exercises several components together",
    "llm: makes a REAL LLM call — costs money and needs GEMINI_API_KEY",
    "slow: takes more than a few seconds",
    "combat: combat subsystem (tests/combat/)",
    "deterministic: 5e mechanics with NO LLM and no network — the game-flow oracle",
]
# Every test gets a hard ceiling. Combat used to hang CI to zero output on a
# blocking input() (fixed in 1.8); this makes a regression fail instead of hang.
timeout = 120
filterwarnings = [
    "ignore::DeprecationWarning:httplib2.*",
    "ignore::pydantic.PydanticDeprecatedSince20",
]

[tool.setuptools]
# Not a distributable package; the game runs from the source tree.
packages = []
