[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roshar-dnd"
version = "0.5.0"
description = "AI Dungeon Master for D&D 5e in Brandon Sanderson's Cosmere (Roshar)"
requires-python = ">=3.10"

# Canonical dependency list, managed with `uv` (replaces the conda/pip flow in
# install_dependencies.sh — see README/CLAUDE.md for the `uv run` commands).
# requirements.txt is kept in sync for anyone still on the conda path; this list
# was transcribed from it 2026-09-11, so if you add a dependency, add it in BOTH
# places until requirements.txt is retired.
dependencies = [
    "haystack-ai>=2.0.0,<3.0",         # Core Haystack pipeline framework. Capped below
                                        # 3.0: verified 2026-09-11 that `>=2.0.0` alone
                                        # resolves 3.1.1 (the conda env has 2.21.0), and
                                        # 3.x moved SentenceTransformersTextEmbedder out
                                        # of haystack.components.embedders entirely —
                                        # ImportError, not a deprecation warning. The
                                        # rest of this codebase is written against 2.x.
    "qdrant-haystack>=4.0.0",          # Qdrant integration for Haystack
    "google-genai>=0.1.0",             # Gemini SDK
    "sentence-transformers>=2.2.0",    # Text embeddings (BGE models)
    "qdrant-client>=1.7.0",            # Qdrant vector database client
    "docling>=2.0.0",                  # PDF/document parsing and extraction
    "docling-core>=2.0.0",             # Docling core data structures
    "pyarrow>=10.0.0",                 # Apache Arrow for Parquet file handling
    "pandas>=2.0.0",                   # DataFrame operations for table extraction
    "pillow>=10.0.0",                  # Image loading and manipulation
    "imagehash>=4.3.0",                # Perceptual hashing for image deduplication
    "numpy>=1.24.0",                   # Array operations for image analysis
    "pydantic>=2.0.0",                 # Data validation and settings management
    "python-dotenv>=1.0.0",            # Load environment variables from .env
    "pyyaml>=6.0",                     # YAML configuration parsing
    "d20>=1.1.2",                      # Avrae dice parser (components/dice.py)
    "langgraph>=1.0",                  # Durable turn loop (plan 3.5 / D4)
    "langgraph-checkpoint-sqlite>=2.0", # Cross-process turn checkpoints
    "langchain-google-genai>=4.0",     # Gemini driver for LangGraph
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-xdist>=3.0.0",             # Parallel test execution (-n 8 is the default)
    "pytest-timeout>=2.0",             # Bounds hanging tests
]

[tool.pytest.ini_options]
# Plan 4: `pytest tests/` used to abort with INTERNALERROR because three files
# ran pytest.main()/sys.exit() at import scope (fixed in 0.8), and the marks
# below were never registered, so filtering by them silently selected nothing.
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--strict-markers",   # an unregistered mark is now an error, not a silent no-op
    "-ra",
    # PARALLEL BY DEFAULT. Sequentially the suite takes ~4.5 minutes (combat alone
    # 170s), which is slow enough that it stops being run on every change — and an
    # unrun test is no test. Measured on 12 cores:
    #
    #     combat       170s -> 15s   (497 passed)
    #     non-combat   100s -> 46s   (1034 passed)
    #
    # `-n auto` would use all 12; 8 leaves headroom so the machine stays usable and
    # the workers do not contend.
    #
    # It also removed a REAL failure: test_encounter_does_not_end_at_zero_hp passed
    # alone and failed in the full sequential run. Fresh worker processes isolate the
    # class-level global state this codebase carries (`Entity._entity_by_position`,
    # `Tile._tile_registry`, the condition registries) — so the parallel result is
    # the more trustworthy one, not merely the faster one.
    #
    # CAVEAT: xdist hides ordering bugs as well as working around them. When a test
    # fails, re-run that FILE with `-p no:xdist -n0` before concluding anything about
    # why. Use `-n0` for pdb, and for any test that needs a single shared process.
    "-n", "8",
]
markers = [
    "unit: fast, no I/O, no network",
    "integration: exercises several components together",
    "llm: makes a REAL LLM call — costs money and needs GEMINI_API_KEY",
    "slow: takes more than a few seconds",
    "combat: combat subsystem (tests/combat/)",
    "deterministic: 5e mechanics with NO LLM and no network — the game-flow oracle",
]
# Every test gets a hard ceiling. Combat used to hang CI to zero output on a
# blocking input() (fixed in 1.8); this makes a regression fail instead of hang.
timeout = 120
filterwarnings = [
    "ignore::DeprecationWarning:httplib2.*",
    "ignore::pydantic.PydanticDeprecatedSince20",
]

[tool.setuptools]
# Not a distributable package; the game runs from the source tree.
packages = []
